[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis-projekt-inventar"
version = "0.1.0"
description = "Lokales Inventar für QGIS-Projektdateien"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
qgis-inventar = "qgis_projekt_inventar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
